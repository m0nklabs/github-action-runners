# Private/public SAST without GitHub Code Scanning entitlement or inherited secrets.
# Pin the reusable workflow to a reviewed commit SHA for a controlled rollout.
name: Semgrep SAST

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Choose a repository-specific weekly UTC slot to spread runner load.
    - cron: '23 4 * * 3'
  workflow_dispatch:

concurrency:
  group: semgrep-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  semgrep:
    # Fork PRs need an explicitly isolated runner policy, not a persistent org host.
    # This skip is NOT a completed scan. Never use pull_request_target for checkout.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    uses: m0nklabs/github-action-runners/.github/workflows/semgrep-ci.yml@main
    with:
      config: p/default
      src-dir: '.'
      # Initial rollout reports findings; scanner failures still fail the job.
      fail-on: none
      runs-on: '["self-hosted", "Linux", "X64"]'
      timeout-minutes: 20
      # Per rule/file, integer 1–120; distinct from the whole-job timeout.
      engine-timeout-seconds: 30
      scan-jobs: 2
      # Registry rule ids to exclude, newline/comma-separated. Use ONLY for
      # rules known to be broken (e.g. re-parsing run: blocks as Bash and
      # false-positive on every ${{ }} expression). Each id must match
      # [a-zA-Z0-9._-]+; invalid input fails before the scanner runs. This is
      # rule-scoped diagnostic exclusion, NOT findings suppression: scanner,
      # config, report and gate failures remain red. Example (kept commented):
      # exclude-rules: |
      #   yaml.github-actions.security.curl-eval.curl-eval
    # No secrets: inherit. The scan only needs the caller's contents: read token.
    # Personal repositories must select runners they already have access to.
    # Hosted labels require a separate private-minutes/billing decision; this
    # reusable workflow does not lend org runners or register personal runners.
