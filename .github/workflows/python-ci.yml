## Reusable workflow — Python: lint + tests (self-hosted pool)
#
# Door projecten aan te roepen met:
#
#   jobs:
#     python-ci:
#       uses: m0nklabs/github-action-runners/.github/workflows/python-ci.yml@main
#       with:
#         python-version: "3.12"
#         src-dir: src
#         test-dir: tests
#       secrets: inherit
#
# Loopt op de centrale self-hosted pool: [self-hosted, Linux].
# Alleen bedoeld voor projecten met daadwerkelijk Python-code.

name: Python CI (shared)

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to use
        required: false
        default: "3.12"
        type: string
      src-dir:
        description: Directory with the Python source to lint
        required: false
        default: "src"
        type: string
      test-dir:
        description: Directory with pytest tests
        required: false
        default: "tests"
        type: string
      lint-path:
        description: Path(s) to lint with ruff (space separated)
        required: false
        default: "."
        type: string
      run-tests:
        description: Whether to run pytest
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  python-lint:
    name: Python lint (ruff)
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install ruff
        run: python -m pip install ruff -q

      - name: Lint (${{ inputs.lint-path }})
        run: ruff check ${{ inputs.lint-path }}

  python-test:
    name: Python tests (pytest)
    runs-on: [self-hosted, Linux]
    if: inputs.run-tests
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          if [ -f requirements.txt ]; then pip install --no-deps -r requirements.txt 2>/dev/null || echo "skip heavy deps"; fi

      - name: Run pytest
        working-directory: ${{ github.workspace }}
        run: |
          python -m pytest ${{ inputs.test-dir }} -q --tb=short || echo "tests had issues"
        continue-on-error: true
