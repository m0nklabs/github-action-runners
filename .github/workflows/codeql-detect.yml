## Reusable workflow — CodeQL met AUTOMATISCHE taal-detectie
#
#   jobs:
#     codeql:
#       uses: m0nklabs/github-action-runners/.github/workflows/codeql-detect.yml@main
#       secrets: inherit
#
# Detecteert via de GitHub languages API welke CodeQL-talen het project
# werkelijk bevat (met percentages) en draait CodeQL alleen voor die talen.
# Geen handmatige `languages`-input nodig.
#
# Optioneel: geef `min-percent` mee om talen onder een drempel over te slaan.
#
#   with:
#     min-percent: 1
#
# Loopt op de centrale self-hosted pool: [self-hosted, Linux].

name: CodeQL auto-detect (shared)

on:
  workflow_call:
    inputs:
      min-percent:
        description: Skip languages below this percentage (default 0 = include all CodeQL languages)
        required: false
        default: "0"
        type: string
      queries:
        description: Query suite(s), e.g. security-extended
        required: false
        default: security-extended
        type: string

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  detect:
    name: Detect languages
    runs-on: [self-hosted, Linux]
    outputs:
      languages: ${{ steps.detect.outputs.languages }}
      summary: ${{ steps.detect.outputs.summary }}
      public: ${{ steps.detect.outputs.public }}
      lang_matrix: ${{ steps.detect.outputs.lang_matrix }}
    steps:
      - name: Detect CodeQL languages via GitHub API
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          MIN_PCT: ${{ inputs.min-percent }}
        run: |
          # CodeQL/code-scanning is gratis op PUBLIEKE repos; op privé-repos
          # vereist het betaald Advanced Security. Detecteer de privacy zodat
          # we geen CodeQL-jobs starten die op een privé-repo niet kunnen draaien.
          is_public="$(gh api "/repos/${OWNER}/${REPO}" --jq '.private == false')"
          echo "public=$is_public" >> "$GITHUB_OUTPUT"
          if [ "$is_public" != "true" ]; then
            echo "languages=[]" >> "$GITHUB_OUTPUT"
            echo "summary=⚠️ Private repo: CodeQL/code-scanning vereist hier betaald **Advanced Security** (op publieke repos is het gratis). CodeQL overgeslagen." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          languages="$(gh api "/repos/${OWNER}/${REPO}/languages")"
          total="$(echo "$languages" | grep -oE ':[0-9]+' | sed 's/://' | awk '{s+=$1} END{print s}')"
          declare -A MAP=( [C]="c-cpp" [C++]="c-cpp" [C#]="csharp" [Go]="go" \
            [Java]="java-kotlin" [Kotlin]="java-kotlin" \
            [JavaScript]="javascript-typescript" [TypeScript]="javascript-typescript" \
            [Python]="python" [Ruby]="ruby" [Swift]="swift" )
          # Gecompileerde talen moeten een door de CodeQL-autobuilder herkend
          # build-systeem hebben, anders kan CodeQL ze niet analyseren en faalt
          # de run met "No supported build system detected". Detecteer de best-
          #andenboom één keer en sla zo'n taal over als er geen build-systeem is.
          buildfiles="$(gh api "/repos/${OWNER}/${REPO}/git/trees/${{ github.sha }}?recursive=1" --jq '.tree[].path' 2>/dev/null || true)"
          declare -A BUILD=( [c-cpp]="CMakeLists.txt|Makefile|makefile|configure.ac|\.sln|\.slnx|\.vcxproj|\.xcodeproj|WORKSPACE|BUILD.bazel" \
            [csharp]="\.sln|\.csproj" \
            [go]="go\.mod" \
            [java-kotlin]="pom\.xml|build\.gradle|settings\.gradle" \
            [swift]="Package\.swift|\.xcodeproj" )
          cql=()
          skipped_compiled=""
          while IFS=: read -r name bytes; do
            c="${MAP[$name]:-}"
            [[ -z "$c" ]] && continue
            pct=$(awk -v b="$bytes" -v t="$total" 'BEGIN{printf "%.1f", (b/t)*100}')
            if awk -v p="$pct" -v m="$MIN_PCT" 'BEGIN{exit !(p>=m)}'; then
              if [[ ! " ${cql[*]} " =~ " ${c} " ]]; then
                # gecompileerde taal zonder build-systeem overslaan (anders fail)
                if [[ -n "${BUILD[$c]:-}" ]] && ! echo "$buildfiles" | grep -qE "${BUILD[$c]}"; then
                  skipped_compiled="$skipped_compiled $c"
                  continue
                fi
                cql+=("$c:${name}:${pct}")
              fi
            fi
          done < <(echo "$languages" | sed 's/[{}]//g; s/"//g; s/,/\n/g' | tr -d ' ' | grep -E '.+:[0-9]+')

          if [[ ${#cql[@]} -eq 0 ]]; then
            echo "languages=[]" >> "$GITHUB_OUTPUT"
            echo "summary=No CodeQL-supported languages detected." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Enkele CodeQL-talen (uniek) voor de matrix + per taal de build-mode.
          # Geïnterpreteerde talen (python, javascript-typescript, ruby) →
          # build-mode none; gecompileerde talen (C/C++, C#, Go, Java/Kotlin,
          # Swift) → autobuild, anders faalt CodeQL ("could not process any of it").
          langs=()
          matrix_json="["
          for e in "${cql[@]}"; do
            l="${e%%:*}"
            langs+=("$l")
            mode="none"
            case "$l" in
              c-cpp|csharp|go|java-kotlin|swift) mode="autobuild" ;;
            esac
            matrix_json="$matrix_json{\"language\":\"$l\",\"build-mode\":\"$mode\"},"
          done
          matrix_json="${matrix_json%,}]"
          arr="["
          for l in "${langs[@]}"; do arr="$arr\"$l\","; done
          arr="${arr%,}]"
          echo "languages=$arr" >> "$GITHUB_OUTPUT"
          echo "lang_matrix=$matrix_json" >> "$GITHUB_OUTPUT"

          # Summary met percentages
          {
            echo "### 📊 Taalportret (via GitHub languages API)"
            echo ""
            for e in "${cql[@]}"; do
              IFS=: read -r _lang _name _pct <<<"$e"
              echo "- **$_name** ($_pct%)"
            done
            if [[ -n "$skipped_compiled" ]]; then
              echo ""
              echo "> ⏭️ Overgeslagen gecompileerde taal zonder CodeQL-build-systeem:"
              for s in $skipped_compiled; do echo "> - **$s**"; done
            fi
            echo ""
            echo "CodeQL draait voor: \`$arr\`"
          } > /tmp/languagesummary.txt
          echo "summary<<EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/languagesummary.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Print language summary
        run: |
          cat /tmp/languagesummary.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "${{ steps.detect.outputs.summary }}"

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: [self-hosted, Linux]
    needs: detect
    if: needs.detect.outputs.public == 'true' && needs.detect.outputs.languages != '[]'
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.lang_matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: ${{ inputs.queries }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
