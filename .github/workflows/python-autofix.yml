## Reusable workflow — Python: ruff autofix (self-hosted pool)
#
# Draait `ruff check --fix` op de PR-branch en committ/pusht de fixes
# automatisch (github-actions[bot]). Aanroepen vanuit een consumer-workflow:
#
#   name: Ruff autofix
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened]
#   jobs:
#     autofix:
#       uses: m0nklabs/github-action-runners/.github/workflows/python-autofix.yml@main
#       with:
#         python-version: "3.12"
#         lint-path: "app scripts tests"
#       secrets: inherit
#
# Let op: pusht alleen branches in dezelfde repo (fork-PR's worden overgeslagen;
# de push-stap faalt dan bewust — voeg in dat geval een eigen fallback toe).
# Loopt op de centrale self-hosted pool: [self-hosted, Linux].

name: Python autofix (ruff)

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to use
        required: false
        default: "3.12"
        type: string
      lint-path:
        description: Path(s) to lint with ruff (space separated)
        required: false
        default: "."
        type: string
      commit-message:
        description: Commit message for the autofix commit
        required: false
        default: "style: apply ruff autofixes"
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  ruff-autofix:
    name: Ruff autofix
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install ruff
        run: python -m pip install ruff -q

      - name: Apply autofixes
        run: ruff check ${{ inputs.lint-path }} --fix || true

      - name: Commit & push fixes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No autofixes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "${{ inputs.commit-message }}"
          # Push with a real user PAT (AUTOFIX_PAT) when available — commits pushed
          # with GITHUB_TOKEN do NOT trigger new workflow runs (GitHub security
          # rule). Fall back to GITHUB_TOKEN only when the PAT secret is absent.
          if [ -n "${AUTOFIX_PAT:-}" ]; then
            git push "https://x-access-token:${AUTOFIX_PAT}@github.com/${GITHUB_REPOSITORY}.git" "${{ github.head_ref }}"
          else
            git push origin "${{ github.head_ref }}"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTOFIX_PAT: ${{ secrets.AUTOFIX_PAT }}
